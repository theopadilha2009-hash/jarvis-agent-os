<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07060c">
  <title>Agenda — JARVIS</title>
  <link rel="icon" href="/ui/jarvis-logo.png" type="image/png">
  <style>
    :root {
      --roxo: 168, 85, 247;
      --azul: 59, 130, 246;
      --fundo: #0a0812;
      --vidro: rgba(255, 255, 255, .055);
      --borda: rgba(255, 255, 255, .1);
      --texto: #eae6f5;
      --fraco: rgba(234, 230, 245, .55);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 22% 18%, rgba(var(--roxo), .22), transparent 55%),
        radial-gradient(circle at 82% 78%, rgba(var(--azul), .18), transparent 55%),
        var(--fundo);
      color: var(--texto);
      font-family: ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 28px;
      padding: 34px;
    }

    /* O JARVIS olhando para a agenda, à esquerda. */
    .jarvis {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      position: sticky;
      top: 34px;
      align-self: start;
    }
    .orb {
      width: 168px;
      height: 168px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 40% 35%, rgba(var(--roxo), .55), rgba(var(--azul), .3) 60%, transparent 72%);
      box-shadow: 0 0 0 1px rgba(var(--roxo), .35), 0 0 60px rgba(var(--roxo), .35);
      position: relative;
    }
    .orb img { width: 78%; height: 78%; object-fit: contain; opacity: .95; }
    .orb::after {
      content: "";
      position: absolute;
      inset: -18%;
      border-radius: 50%;
      border: 1px solid rgba(var(--roxo), .22);
      animation: pulsar 3.4s ease-in-out infinite;
    }
    @keyframes pulsar {
      0%, 100% { transform: scale(1); opacity: .5; }
      50%      { transform: scale(1.08); opacity: .9; }
    }
    .waveform { display: flex; align-items: center; gap: 4px; height: 52px; }
    .waveform i {
      display: block;
      width: 3px;
      border-radius: 99px;
      background: linear-gradient(180deg, rgba(232, 121, 249, .95), rgba(var(--azul), .95));
      animation: onda 900ms ease-in-out infinite alternate;
    }
    @keyframes onda {
      from { height: 6px; }
      to   { height: 34px; }
    }
    .fala {
      text-align: center;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--fraco);
      max-width: 240px;
    }
    .fala strong { color: var(--texto); font-weight: 600; }

    /* A agenda em si. */
    .painel {
      background: var(--vidro);
      border: 1px solid var(--borda);
      border-radius: 24px;
      padding: 28px 30px;
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
    }
    .topo {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 6px;
    }
    h1 { font-size: 27px; font-weight: 620; margin: 0; letter-spacing: -.02em; }
    .hoje { font-size: 13px; color: var(--fraco); }
    .sub { margin: 0 0 24px; font-size: 13.5px; color: var(--fraco); }

    .lista { display: flex; flex-direction: column; gap: 11px; }
    .item {
      display: grid;
      grid-template-columns: 62px 1fr auto;
      align-items: center;
      gap: 15px;
      padding: 15px 17px;
      border-radius: 15px;
      background: rgba(255, 255, 255, .035);
      border: 1px solid var(--borda);
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .item:hover {
      transform: translateX(3px);
      border-color: rgba(var(--roxo), .4);
      background: rgba(var(--roxo), .07);
    }
    .hora {
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      font-weight: 600;
      color: rgba(var(--roxo), 1);
    }
    .titulo { font-size: 15px; line-height: 1.35; }
    .marca {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(var(--azul), .16);
      color: rgb(147, 197, 253);
      white-space: nowrap;
    }
    .marca.atrasado {
      background: rgba(248, 113, 113, .16);
      color: rgb(252, 165, 165);
    }
    .vazio {
      padding: 52px 20px;
      text-align: center;
      color: var(--fraco);
      font-size: 14px;
      line-height: 1.6;
    }
    .vazio b { display: block; color: var(--texto); font-size: 16px; margin-bottom: 6px; }

    @media (max-width: 820px) {
      body { grid-template-columns: 1fr; padding: 22px; }
      .jarvis { position: static; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orb::after, .waveform i { animation: none; }
      .waveform i { height: 14px; }
    }
  </style>
</head>
<body>
  <aside class="jarvis">
    <div class="orb"><img src="/ui/jarvis-logo.png" alt="JARVIS"></div>
    <div class="waveform" id="waveform" aria-hidden="true"></div>
    <p class="fala" id="fala">Consultando a agenda, senhor.</p>
  </aside>

  <main class="painel">
    <div class="topo">
      <h1>Agenda</h1>
      <span class="hoje" id="hoje"></span>
    </div>
    <p class="sub" id="resumo">carregando…</p>
    <section class="lista" id="lista">
      <div class="vazio"><b>Buscando seus compromissos</b>um instante.</div>
    </section>
  </main>

  <script>
    // Barra do waveform: alturas irregulares para não parecer metrônomo.
    (function montarOnda() {
      const alvo = document.getElementById("waveform");
      const perfil = [.3, .5, .75, 1, .8, 1, .72, .45, .3];
      for (let i = 0; i < 18; i++) {
        const barra = document.createElement("i");
        const altura = perfil[i % perfil.length] ?? .5;
        barra.style.height = `${Math.round(6 + altura * 28)}px`;
        barra.style.animationDuration = `${520 + (i * 97) % 620}ms`;
        barra.style.animationDelay = `${(i * 63) % 400}ms`;
        alvo.appendChild(barra);
      }
    })();

    const DIAS = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
    const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

    const agora = new Date();
    document.getElementById("hoje").textContent =
      `${DIAS[agora.getDay()]}, ${agora.getDate()} de ${MESES[agora.getMonth()]}`;

    function horaDe(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "—";
      return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    }

    function diaDe(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      const hoje = new Date();
      const mesmoDia = d.toDateString() === hoje.toDateString();
      if (mesmoDia) return "hoje";
      const amanha = new Date(hoje);
      amanha.setDate(hoje.getDate() + 1);
      if (d.toDateString() === amanha.toDateString()) return "amanhã";
      return `${d.getDate()}/${d.getMonth() + 1}`;
    }

    function atrasado(iso) {
      if (!iso) return false;
      const d = new Date(iso);
      return !Number.isNaN(d.getTime()) && d < new Date();
    }

    function desenhar(itens) {
      const lista = document.getElementById("lista");
      const resumo = document.getElementById("resumo");
      const fala = document.getElementById("fala");
      if (!Array.isArray(itens) || !itens.length) {
        lista.innerHTML = '<div class="vazio"><b>Nada marcado</b>A agenda está livre. Bom momento para adiantar o próximo vídeo.</div>';
        resumo.textContent = "nenhum compromisso pendente";
        fala.innerHTML = "<strong>Agenda livre, senhor.</strong><br>Nenhum compromisso pendente.";
        return;
      }
      const urgentes = itens.filter((i) => atrasado(i.scheduled_for)).length;
      resumo.textContent = urgentes
        ? `${itens.length} compromissos · ${urgentes} atrasado${urgentes > 1 ? "s" : ""}`
        : `${itens.length} compromissos pendentes`;
      fala.innerHTML = urgentes
        ? `<strong>${urgentes} item${urgentes > 1 ? "s" : ""} atrasado${urgentes > 1 ? "s" : ""}, senhor.</strong><br>Sugiro começar por aí.`
        : "<strong>Tudo em ordem.</strong><br>Seus compromissos estão abaixo.";
      lista.innerHTML = "";
      for (const item of itens) {
        const titulo = String(item.title || "item da agenda");
        const atras = atrasado(item.scheduled_for);
        const linha = document.createElement("div");
        linha.className = "item";
        const hora = document.createElement("span");
        hora.className = "hora";
        hora.textContent = horaDe(item.scheduled_for);
        const nome = document.createElement("span");
        nome.className = "titulo";
        nome.textContent = titulo;
        const marca = document.createElement("span");
        marca.className = `marca${atras ? " atrasado" : ""}`;
        marca.textContent = atras ? `atrasado · ${diaDe(item.scheduled_for)}` : diaDe(item.scheduled_for);
        linha.append(hora, nome, marca);
        lista.appendChild(linha);
      }
    }

    // A agenda é privada: o gateway exige o token do dono, o mesmo que o
    // /fala guarda no localStorage depois do login.
    function tokenDoDono() {
      try { return window.localStorage.getItem("jarvis-owner-token-v1") || ""; } catch { return ""; }
    }

    const cabecalhos = { "Accept": "application/json" };
    const token = tokenDoDono();
    if (token) cabecalhos["X-Jarvis-Owner-Token"] = token;

    fetch("/agenda", { headers: cabecalhos })
      .then((r) => r.json())
      .then((dados) => {
        if (dados && dados.ok === false) {
          const lista = document.getElementById("lista");
          lista.innerHTML =
            '<div class="vazio"><b>Preciso que você entre</b>A agenda é privada. Abra o JARVIS, faça login, e volte aqui.</div>';
          document.getElementById("resumo").textContent = "sessão necessária";
          document.getElementById("fala").innerHTML =
            "<strong>Não posso mostrar a agenda.</strong><br>Entre na sua conta primeiro.";
          return;
        }
        const itens = dados?.agenda || dados?.items || dados?.data || [];
        desenhar(itens);
      })
      .catch(() => {
        document.getElementById("lista").innerHTML =
          '<div class="vazio"><b>Não consegui ler a agenda</b>O servidor não respondeu. Tente de novo em instantes.</div>';
        document.getElementById("resumo").textContent = "falha ao carregar";
        document.getElementById("fala").textContent = "Não consegui acessar a agenda, senhor.";
      });
  </script>
</body>
</html>
