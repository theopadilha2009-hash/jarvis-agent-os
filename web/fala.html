<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07060c">
  <meta name="creator-seal" content="ggCZbZFBcds2X3zL5N5jloFWuxA=">
  <title>JARVIS</title>
  <link rel="icon" href="/ui/jarvis-logo.png?v=20260813-logonative1" type="image/png">
  <meta name="jarvis-shell" content="20260820-update1">
  <link rel="stylesheet" href="/ui/fala.css?v=20260820-listen5">
</head>
<body>
  <main class="orb-shell">
    <div class="halo" aria-hidden="true"></div>
    <button id="orb" type="button" aria-label="Falar com o JARVIS">
      <i></i><i></i>
      <img src="/ui/jarvis-logo.png?v=20260813-logonative1" width="148" height="148" alt="">
    </button>
    <strong id="statusLine">Jarvis</strong>
    <p id="caption">Pode falar: Jarvis.</p>
    <p id="heardLine" hidden></p>
    <p id="voiceChip" hidden>voz</p>
    <p id="buildLine" title="Versão desta janela">v20260820-update1</p>
    <aside id="updateToast" class="update-toast" hidden>
      <span>
        <small>atualização disponível</small>
        <em id="updateToastVersions">nova versão no ar</em>
      </span>
      <button id="updateReloadButton" type="button">Reiniciar</button>
    </aside>
    <p id="lastAnswer" hidden></p>
    <button id="retryButton" type="button" hidden>tentar de novo</button>
    <form id="askForm">
      <input id="askInput" type="text" autocomplete="off" placeholder="ou escreva…" aria-label="Pedido para o JARVIS">
    </form>
    <nav class="launch" aria-label="Abrir agora">
      <button type="button" data-open="https://www.google.com">Google</button>
      <button type="button" data-open="https://web.whatsapp.com">WhatsApp</button>
    </nav>
    <div class="face-actions">
      <button id="reloadButton" type="button">atualizar</button>
      <button id="minimizeButton" type="button" hidden>minimizar</button>
      <button id="loginToggle" type="button">entrar</button>
      <button id="moreButton" type="button">mais</button>
    </div>
    <div id="extras" hidden>
      <p id="accessLine">Visitante</p>
      <form id="loginForm">
        <input id="loginUser" autocomplete="username" placeholder="Login" aria-label="Login">
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha">
        <label class="remember-login"><input id="rememberLogin" type="checkbox" checked aria-label="Manter conectado neste aparelho"> manter conectado</label>
        <button type="submit">Entrar</button>
        <button id="logoutButton" type="button" hidden>Sair</button>
      </form>
      <nav class="quick">
        <button type="button" data-open="https://www.youtube.com">YouTube</button>
        <button type="button" data-open="https://open.spotify.com">Spotify</button>
        <button type="button" data-open="https://maps.google.com">Mapas</button>
        <button type="button" data-open="https://calendar.google.com">Agenda</button>
        <button type="button" data-open="https://mail.google.com">Gmail</button>
        <button type="button" data-open="https://drive.google.com">Drive</button>
        <button type="button" data-open="https://www.instagram.com">Instagram</button>
        <a href="/cockpit">Cockpit</a>
      </nav>
      <button id="debugToggle" type="button">diagnóstico</button>
      <a class="download" href="/download/mac">Baixar no Mac</a>
      <p class="by">por <span data-creator-lock>…</span></p>
    </div>
  </main>
  <script src="/ui/creator-seal.js?v=20260817-app1"></script>
  <script src="/ui/local-voice.js?v=20260818-voice2"></script>
  <script src="/ui/fala.js?v=20260820-listen10"></script>
</body>
</html>
