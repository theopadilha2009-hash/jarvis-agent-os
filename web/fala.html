<!doctype html>
<html lang="pt-BR" class="booting">
<head>
  <meta charset="utf-8">
  <script>
    if (/(?:^|[?&])app=1(?:&|$)/.test(location.search)) {
      document.documentElement.classList.add("app-mode", "idle-orb");
    }
  </script>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07060c">
  <meta name="creator-seal" content="ggCZbZFBcds2X3zL5N5jloFWuxA=">
  <title>JARVIS</title>
  <link rel="icon" href="/ui/jarvis-logo.png?v=20260813-logonative1" type="image/png">
  <meta name="jarvis-shell" content="20260821-park1">
  <link rel="stylesheet" href="/ui/fala.css?v=20260821-park1">
</head>
<body>
  <main class="orb-shell">
    <div class="halo" aria-hidden="true"></div>
    <div class="viz" aria-hidden="true"><b></b><b></b><b></b><b></b></div>
    <button id="orb" type="button" aria-label="Falar com o JARVIS">
      <i></i><i></i>
      <img src="/ui/jarvis-logo.png?v=20260813-logonative1" width="148" height="148" alt="JARVIS">
    </button>
    <strong id="statusLine">JARVIS</strong>
    <p id="caption">A mesma conta do site.</p>
    <p id="hint">Neste Mac você entra só agora.</p>
    <p id="heardLine" hidden></p>
    <aside id="updateToast" class="update-toast" hidden>
      <span>
        <small>atualização disponível</small>
        <em id="updateToastVersions">nova versão no ar</em>
      </span>
      <button id="updateReloadButton" class="btn btn-accent" type="button">Atualizar</button>
    </aside>
    <p id="lastAnswer" hidden></p>
    <button id="retryButton" class="btn" type="button" hidden>tentar de novo</button>
    <div class="dock">
    <form id="askForm">
      <input id="askInput" type="text" autocomplete="off" placeholder="ou escreva…" aria-label="Pedido para o JARVIS">
    </form>
    <nav class="launch" aria-label="Abrir agora">
      <button class="btn btn-accent" type="button" data-open="https://www.google.com">Google</button>
      <button class="btn btn-accent" type="button" data-open="https://web.whatsapp.com">WhatsApp</button>
    </nav>
    <div class="face-actions">
      <button id="moreButton" class="btn" type="button">mais</button>
    </div>
    <div id="extras" hidden>
      <p id="accessLine">Visitante</p>
      <form id="loginForm">
        <input id="loginUser" autocomplete="username" placeholder="Login" aria-label="Login">
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha">
        <label class="remember-login"><input id="rememberLogin" type="checkbox" checked aria-label="Manter conectado neste Mac"> ficar neste Mac</label>
        <button class="btn btn-accent" type="submit">Entrar</button>
        <button id="logoutButton" class="btn" type="button" hidden>Sair</button>
      </form>
      <div class="extra-tools">
        <button id="reloadButton" class="btn" type="button">atualizar</button>
        <button id="minimizeButton" class="btn" type="button" hidden>recolher</button>
        <button id="meetingButton" class="btn" type="button">reunião</button>
      </div>
      <p class="meta">
        <span id="voiceChip" hidden>voz</span>
        <span id="buildLine" title="Versão desta janela">v20260821-park1</span>
      </p>
      <nav class="quick">
        <button class="btn" type="button" data-open="https://www.youtube.com">YouTube</button>
        <button class="btn" type="button" data-open="https://open.spotify.com">Spotify</button>
        <button class="btn" type="button" data-open="https://maps.google.com">Mapas</button>
        <button class="btn" type="button" data-open="https://calendar.google.com">Agenda</button>
        <button class="btn" type="button" data-open="https://mail.google.com">Gmail</button>
        <button class="btn" type="button" data-open="https://drive.google.com">Drive</button>
        <button class="btn" type="button" data-open="https://www.instagram.com">Instagram</button>
        <a class="btn" href="/cockpit">Cockpit</a>
      </nav>
      <button id="debugToggle" class="btn" type="button">diagnóstico</button>
      <a class="download" href="/download/mac">Baixar no Mac</a>
      <p class="by">por <span data-creator-lock>…</span></p>
    </div>
    </div>
  </main>
  <script src="/ui/creator-seal.js?v=20260817-app1"></script>
  <script src="/ui/local-voice.js?v=20260818-voice2"></script>
  <script src="/ui/fala.js?v=20260821-park1"></script>
</body>
</html>
