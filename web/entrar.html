<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06141c">
  <meta name="description" content="JARVIS — entre com login e senha. Assistente pessoal de Theo Padilha.">
  <title>JARVIS · entrar</title>
  <link rel="icon" href="/ui/jarvis-logo.png?v=20260813-logonative1" type="image/png">
  <link rel="apple-touch-icon" href="/ui/jarvis-logo.png?v=20260813-logonative1">
  <link rel="stylesheet" href="/ui/entrar.css?v=20261026-ceu1">
</head>
<body>
  <main class="gate">
    <header class="head">
      <img class="mark" src="/ui/jarvis-logo.png?v=20260813-logonative1" width="64" height="52" alt="">
      <h1>JARVIS</h1>
      <p class="lead">Entre com seu login e senha.</p>
    </header>

    <p id="sessionHint" class="session-hint" hidden>
      Há uma sessão neste navegador.
      <a href="/cockpit">Abrir o JARVIS</a>
    </p>

    <p id="signupDone" class="seal" role="status" hidden></p>

    <form id="loginForm" autocomplete="on">
      <label>
        <span>Login</span>
        <input id="loginUser" name="username" autocomplete="username" required maxlength="80" placeholder="seu login">
      </label>
      <label>
        <span>Senha</span>
        <input id="loginPass" name="password" type="password" autocomplete="current-password" required maxlength="200" placeholder="sua senha">
      </label>
      <label class="remember-row">
        <input id="rememberMe" name="remember" type="checkbox" checked>
        <span>Lembrar de mim neste aparelho</span>
      </label>
      <p id="loginError" class="form-error" role="alert" hidden></p>
      <button id="loginSubmit" type="submit" class="btn-primary">Entrar</button>
    </form>

    <p class="toggle-account">
      <button id="signupToggle" type="button" class="btn-secondary">Criar uma conta</button>
    </p>

    <form id="signupForm" hidden autocomplete="on">
      <label>
        <span>Login</span>
        <input id="signupUser" name="username" autocomplete="username" required maxlength="32" placeholder="3 a 32 caracteres, sem espaço">
      </label>
      <label>
        <span>Senha</span>
        <input id="signupPass" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="mínimo 8 caracteres">
      </label>
      <label>
        <span>Repetir senha</span>
        <input id="signupPass2" name="password_confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="repita a senha">
      </label>
      <label class="terms-row">
        <input id="signupTerms" name="accepted_terms" type="checkbox">
        <span>aceito os <a href="/termos" target="_blank" rel="noopener">termos de uso</a></span>
      </label>
      <p id="signupError" class="form-error" role="alert" hidden></p>
      <button id="signupSubmit" type="submit" class="btn-primary">Criar conta</button>
    </form>

    <p class="guest">
      <a href="/cockpit?guest=1">Entrar como visitante</a>
      · conversa pública, sem Mac e sem bloco de notas.
    </p>

    <nav class="links" aria-label="Outros caminhos">
      <a href="/download/mac">Baixar no Mac</a>
      <a href="/fala">Fala</a>
      <a href="/produto">Produto</a>
      <a href="/theo">Criador</a>
    </nav>
    <p class="by">por <span data-creator-lock>Theo Lorentz Padilha</span></p>
  </main>
  <script src="/ui/creator-seal.js?v=20260817-app1"></script>
  <script src="/ui/entrar.js?v=20261026-ceu1"></script>
</body>
</html>
